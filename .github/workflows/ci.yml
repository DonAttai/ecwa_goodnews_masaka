name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # $0: GitHub free minutes + pnpm store cache. No paid services.
    env:
      SKIP_ENV_VALIDATION: "1"
      JWT_SECRET: "ci-test-secret-0123456789abcdef00"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm typecheck
      # Lint is advisory until upstream typescript-eslint supports TS 7
      # (pre-existing crash in typescript-estree `reading 'Cjs'`, fails on main too).
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm test
      - run: pnpm build
